<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="900" viewBox="0 0 1200 900" fill="none" opacity="0.18">
  <defs>
    <!-- Cyan glow filter -->
    <filter id="arc-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Central Arc Reactor Core (Mark-85) -->
  <g transform="translate(600, 450)">
    <!-- Outer Arc Rings -->
    <circle cx="0" cy="0" r="260" stroke="#00f0ff" stroke-width="1.5" stroke-dasharray="12 8" opacity="0.4"/>
    <circle cx="0" cy="0" r="230" stroke="#e61a29" stroke-width="2" opacity="0.5"/>
    <circle cx="0" cy="0" r="200" stroke="#ffd700" stroke-width="1.5" stroke-dasharray="30 15" opacity="0.6"/>
    <circle cx="0" cy="0" r="160" stroke="#00f0ff" stroke-width="2" opacity="0.7"/>
    <circle cx="0" cy="0" r="120" stroke="#00f0ff" stroke-width="3" filter="url(#arc-glow)" opacity="0.8"/>
    <circle cx="0" cy="0" r="80" stroke="#ffffff" stroke-width="2" filter="url(#arc-glow)"/>
    <circle cx="0" cy="0" r="35" fill="#00f0ff" opacity="0.3" filter="url(#arc-glow)"/>
    <circle cx="0" cy="0" r="18" fill="#ffffff" filter="url(#arc-glow)"/>

    <!-- Concentric Tri-segment Conduits -->
    <g stroke="#00f0ff" stroke-width="2" opacity="0.75">
      <!-- 10 Reactor Energy Fins around circle -->
      <line x1="0" y1="-80" x2="0" y2="-160" stroke-width="3"/>
      <line x1="0" y1="80" x2="0" y2="160" stroke-width="3"/>
      <line x1="-80" y1="0" x2="-160" y2="0" stroke-width="3"/>
      <line x1="80" y1="0" x2="160" y2="0" stroke-width="3"/>

      <line x1="-56.5" y1="-56.5" x2="-113" y2="-113" stroke-width="2.5"/>
      <line x1="56.5" y1="-56.5" x2="113" y2="-113" stroke-width="2.5"/>
      <line x1="-56.5" y1="56.5" x2="-113" y2="113" stroke-width="2.5"/>
      <line x1="56.5" y1="56.5" x2="113" y2="113" stroke-width="2.5"/>

      <line x1="-76" y1="-25" x2="-152" y2="-50" stroke-width="1.5"/>
      <line x1="76" y1="-25" x2="152" y2="-50" stroke-width="1.5"/>
      <line x1="-76" y1="25" x2="-152" y2="50" stroke-width="1.5"/>
      <line x1="76" y1="25" x2="152" y2="50" stroke-width="1.5"/>
    </g>

    <!-- Chest Armor Triangular Contours (Mark-85) -->
    <polygon points="0,-220 180,-80 140,160 0,250 -140,160 -180,-80" fill="none" stroke="#e61a29" stroke-width="2" opacity="0.6"/>
    <polygon points="0,-240 210,-90 160,180 0,280 -160,180 -210,-90" fill="none" stroke="#ffd700" stroke-width="1" stroke-dasharray="16 8" opacity="0.5"/>

    <!-- Pectoral Armor Plates Contours -->
    <path d="M-220,-80 L-380,-140 L-420,-40 L-260,60 Z" fill="none" stroke="#e61a29" stroke-width="1.5" opacity="0.4"/>
    <path d="M220,-80 L380,-140 L420,-40 L260,60 Z" fill="none" stroke="#e61a29" stroke-width="1.5" opacity="0.4"/>

    <!-- Collarbone Nanite Injectors -->
    <path d="M-180,-120 L-100,-280 L-40,-260 L-120,-110 Z" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>
    <path d="M180,-120 L100,-280 L40,-260 L120,-110 Z" fill="none" stroke="#ffd700" stroke-width="1.5" opacity="0.5"/>

    <!-- Stark Industries HUD Markings -->
    <text x="-120" y="-310" font-family="'Plus Jakarta Sans', monospace" font-size="14" fill="#00f0ff" letter-spacing="4" opacity="0.8">STARK INDUSTRIES // MARK-85</text>
    <text x="-120" y="-290" font-family="'Plus Jakarta Sans', monospace" font-size="11" fill="#e61a29" letter-spacing="3" opacity="0.7">NANITE HOUSING TELEMETRY: 100%</text>
    <text x="60" y="320" font-family="'Plus Jakarta Sans', monospace" font-size="11" fill="#00f0ff" letter-spacing="3" opacity="0.7">SYS.CORE // RT-901 ARCHIVE</text>

    <!-- Hexagonal Nanite Honeycomb Weave -->
    <g stroke="#00f0ff" stroke-width="0.8" opacity="0.3">
      <!-- Cluster 1 (Left) -->
      <polygon points="-300,-50 -285,-75 -255,-75 -240,-50 -255,-25 -285,-25" fill="none"/>
      <polygon points="-240,-50 -225,-75 -195,-75 -180,-50 -195,-25 -225,-25" fill="none"/>
      <polygon points="-270,0 -255,-25 -225,-25 -210,0 -225,25 -255,25" fill="none"/>
      <!-- Cluster 2 (Right) -->
      <polygon points="300,-50 285,-75 255,-75 240,-50 255,-25 285,-25" fill="none"/>
      <polygon points="240,-50 225,-75 195,-75 180,-50 195,-25 225,-25" fill="none"/>
      <polygon points="270,0 255,-25 225,-25 210,0 225,25 255,25" fill="none"/>
    </g>
  </g>
</svg>
